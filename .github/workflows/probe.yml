name: Rate probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe with slow requests
        run: |
          for start in 0 24 48; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" -H "Accept: application/json" "https://bahrain.ounass.com/api/v2/men/sale?fh_start_index=$start")
            ra=$(curl -sI -A "Mozilla/5.0" "https://bahrain.ounass.com/api/v2/men/sale?fh_start_index=$start" | grep -i -E "retry-after|cf-mitigated|server:" | tr '\r\n' '  ')
            echo "::warning::start=$start code=$code headers=[$ra] body=$(head -c 60 /tmp/r | tr -d '\n')"
            sleep 30
          done
