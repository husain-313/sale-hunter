name: Build iOS app

on:
  push:
    branches: [main]
    paths:
      - "SaleHunter/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SaleHunter.xcodeproj \
            -scheme SaleHunter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SaleHunter.ipa Payload
          ls -lh SaleHunter.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SaleHunter-ipa
          path: SaleHunter.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SaleHunter.ipa \
            --title "Sale Hunter (build ${{ github.run_number }})" \
            --notes "Unsigned IPA. Download it on your iPhone and sign it with your signing app." \
            --latest
