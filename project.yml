name: SaleHunter
options:
  bundleIdPrefix: com.husain313
  deploymentTarget:
    iOS: "16.0"
targets:
  SaleHunter:
    type: application
    platform: iOS
    sources:
      - SaleHunter
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.husain313.salehunter
        PRODUCT_NAME: SaleHunter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sale Hunter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.husain313.salehunter.refresh]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
