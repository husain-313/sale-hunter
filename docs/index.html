<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيّاد التخفيضات</title>
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sale Hunter">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0f12; --panel:#17191e; --panel2:#1f2228; --line:#2a2e36;
    --text:#f2f2f3; --muted:#9aa0aa; --accent:#e8c26a; --sale:#ff5a5f; --new:#4cc38a;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans Arabic",-apple-system,system-ui,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:rgba(14,15,18,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:12px}
  .search{margin-top:10px;width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-size:16px;outline:none}
  .search:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);color:#16120a;border-color:var(--accent);font-weight:600}
  select.chip{appearance:none;-webkit-appearance:none;padding-left:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:12px 50%,17px 50%;background-size:5px 5px;background-repeat:no-repeat}
  select.chip.on{background-image:linear-gradient(45deg,transparent 50%,#16120a 50%),linear-gradient(135deg,#16120a 50%,transparent 50%)}
  .count{color:var(--muted);font-size:13px;padding:12px 16px 4px}
  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px 16px 24px}
  @media(min-width:640px){main{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:960px){main{grid-template-columns:repeat(5,1fr)}}
  .card{background:var(--panel);border-radius:var(--radius);overflow:hidden;position:relative;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid var(--line)}
  .img{aspect-ratio:3/4;background:#fff;display:block;width:100%;object-fit:cover}
  .badge{position:absolute;top:8px;right:8px;background:var(--sale);color:#fff;
    font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px;direction:ltr}
  .tags{position:absolute;top:8px;left:44px;display:flex;gap:4px}
  .tag{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;color:#0e0f12}
  .tag.new{background:var(--new)} .tag.drop{background:var(--accent)}
  .fav{position:absolute;top:6px;left:6px;width:34px;height:34px;border-radius:50%;
    border:none;background:rgba(14,15,18,.65);color:#fff;font-size:17px;cursor:pointer;line-height:34px}
  .fav.on{color:var(--sale)}
  .body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
  .brand{font-size:13px;font-weight:700;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name{font-size:12px;color:var(--muted);direction:ltr;text-align:right;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .price{margin-top:auto;padding-top:6px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .now{font-weight:700;font-size:15px;color:var(--text)}
  .was{font-size:12px;color:var(--muted);text-decoration:line-through}
  .sizes{font-size:11px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty,.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;line-height:1.8}
  #more{height:1px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>صيّاد <span>التخفيضات</span></h1>
    <div class="meta" id="meta">أُناس البحرين</div>
  </div>
  <input class="search" id="q" type="search" placeholder="ابحث: ماركة أو قطعة… مثل Nike أو shirt" autocomplete="off">
  <div class="row" id="discounts"></div>
  <div class="row">
    <button class="chip" id="newOnly">🆕 جديد</button>
    <button class="chip" id="dropOnly">⬇️ نزل سعره</button>
    <button class="chip" id="favOnly">❤️ المفضلة</button>
    <select class="chip" id="cat"><option value="">كل الأقسام</option></select>
    <select class="chip" id="brand"><option value="">كل الماركات</option></select>
    <select class="chip" id="size"><option value="">كل المقاسات</option></select>
    <select class="chip" id="sort">
      <option value="disc">أعلى خصم</option>
      <option value="low">أقل سعر</option>
      <option value="high">أعلى سعر</option>
      <option value="new">الأحدث</option>
      <option value="save">أكبر توفير</option>
    </select>
  </div>
</header>
<div class="count" id="count"></div>
<main id="grid"><div class="loading">جاري تحميل التخفيضات…</div></main>
<div id="more"></div>

<script>
const CAT_AR = {Clothing:"ملابس",Shoes:"أحذية",Accessories:"إكسسوارات",Bags:"حقائب",
  Grooming:"عناية",Home:"منزل",Watches:"ساعات",Beauty:"تجميل",Jewellery:"مجوهرات"};
const SIZE_ORDER = ["XXS","XS","S","M","L","XL","XXL","XXXL","One Size"];
const DISCOUNTS = [0,30,50,60,70];
const PAGE = 40;
const NEW_HOURS = 24;

const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

let ALL = [], VIEW = [], shown = 0, currency = "BHD";
let favs = new Set(store.get("favs", []));
const st = Object.assign({q:"",min:0,cat:"",brand:"",size:"",sort:"disc",newOnly:false,dropOnly:false,favOnly:false},
  store.get("filters", {}));

function hoursSince(iso){ return iso ? (Date.now() - new Date(iso).getTime())/36e5 : 1e9 }
function isNew(i){ return hoursSince(i.f) <= NEW_HOURS }
function isDrop(i){ return i.pp && hoursSince(i.pd) <= 72 }
function fmt(n){ return (Math.round(n*1000)/1000).toLocaleString("en-US") }
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }

function sizeKey(s){
  const i = SIZE_ORDER.indexOf(s);
  if (i >= 0) return [0,i];
  const n = parseFloat(s);
  return isNaN(n) ? [2,s] : [1,n];
}
function cmpSize(a,b){ const x=sizeKey(a),y=sizeKey(b); return x[0]-y[0] || (x[1]<y[1]?-1:x[1]>y[1]?1:0) }

function fillSelect(el, values, label){
  const cur = el.value;
  el.innerHTML = `<option value="">${label}</option>` +
    values.map(([v,t,c]) => `<option value="${esc(v)}">${esc(t)}${c?` (${c})`:""}</option>`).join("");
  el.value = values.some(([v]) => v === cur) ? cur : "";
}

function buildFilters(){
  const cats = {}, brands = {}, sizes = {};
  for (const i of ALL){
    if (i.c) cats[i.c] = (cats[i.c]||0)+1;
    if (i.b) brands[i.b] = (brands[i.b]||0)+1;
    for (const s of i.sz||[]) sizes[s] = (sizes[s]||0)+1;
  }
  fillSelect($("cat"), Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,c])=>[k,CAT_AR[k]||k,c]), "كل الأقسام");
  fillSelect($("brand"), Object.keys(brands).sort((a,b)=>a.localeCompare(b)).map(k=>[k,k,brands[k]]), "كل الماركات");
  fillSelect($("size"), Object.keys(sizes).sort(cmpSize).map(k=>[k,k,sizes[k]]), "كل المقاسات");
  $("discounts").innerHTML = DISCOUNTS.map(d =>
    `<button class="chip" data-d="${d}">${d? d+"%+ خصم" : "كل الخصومات"}</button>`).join("");
  $("discounts").onclick = e => { const b=e.target.closest("[data-d]"); if(!b) return; st.min=+b.dataset.d; apply() };
}

function syncUI(){
  $("q").value = st.q;
  for (const id of ["cat","brand","size","sort"]) { $(id).value = st[id]; $(id).classList.toggle("on", id!=="sort" && !!st[id]) }
  for (const id of ["newOnly","dropOnly","favOnly"]) $(id).classList.toggle("on", st[id]);
  document.querySelectorAll("[data-d]").forEach(b => b.classList.toggle("on", +b.dataset.d === st.min));
}

function apply(){
  const words = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  VIEW = ALL.filter(i =>
    i.d >= st.min &&
    (!st.cat || i.c === st.cat) &&
    (!st.brand || i.b === st.brand) &&
    (!st.size || (i.sz||[]).includes(st.size)) &&
    (!st.newOnly || isNew(i)) &&
    (!st.dropOnly || isDrop(i)) &&
    (!st.favOnly || favs.has(i.id)) &&
    (!words.length || words.every(w => (i.b+" "+i.n+" "+i.t+" "+i.col).toLowerCase().includes(w)))
  );
  const s = st.sort;
  VIEW.sort((a,b) =>
    s==="low" ? a.p-b.p : s==="high" ? b.p-a.p :
    s==="new" ? (b.f||"").localeCompare(a.f||"") :
    s==="save" ? (b.o-b.p)-(a.o-a.p) :
    b.d-a.d || a.p-b.p);
  store.set("filters", st);
  syncUI();
  const nNew = ALL.filter(isNew).length;
  $("count").textContent = `${VIEW.length.toLocaleString("en-US")} قطعة` + (nNew ? ` · ${nNew} جديدة اليوم` : "");
  $("grid").innerHTML = VIEW.length ? "" :
    `<div class="empty">ما في نتائج بهذي الفلاتر.<br>جرّب تخفف الفلاتر أو امسح البحث.</div>`;
  shown = 0; renderMore(); scrollTo({top:0});
}

function card(i){
  const tags = (isNew(i)?`<span class="tag new">جديد</span>`:"") + (isDrop(i)?`<span class="tag drop">نزل سعره</span>`:"");
  return `<a class="card" href="${esc(i.u)}" target="_blank" rel="noopener">
    <img class="img" loading="lazy" src="${esc(i.img)}" alt="">
    <span class="badge">-${i.d}%</span>
    <span class="tags">${tags}</span>
    <button class="fav ${favs.has(i.id)?"on":""}" data-fav="${esc(i.id)}" aria-label="مفضلة">${favs.has(i.id)?"♥":"♡"}</button>
    <div class="body">
      <div class="brand">${esc(i.b)}</div>
      <div class="name">${esc(i.n)}</div>
      <div class="price"><span class="now">${fmt(i.p)} د.ب</span><span class="was">${fmt(i.o)}</span>
        ${isDrop(i)?`<span class="was">${fmt(i.pp)}</span>`:""}</div>
      ${i.sz&&i.sz.length?`<div class="sizes">${esc(i.sz.join(" · "))}</div>`:""}
    </div></a>`;
}

function renderMore(){
  if (shown >= VIEW.length) return;
  $("grid").insertAdjacentHTML("beforeend", VIEW.slice(shown, shown+PAGE).map(card).join(""));
  shown += PAGE;
}

$("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-fav]"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.fav;
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set("favs", [...favs]);
  b.classList.toggle("on", favs.has(id)); b.textContent = favs.has(id) ? "♥" : "♡";
});
let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(()=>{ st.q=e.target.value; apply() }, 200) });
for (const id of ["cat","brand","size","sort"]) $(id).addEventListener("change", e => { st[id]=e.target.value; apply() });
for (const id of ["newOnly","dropOnly","favOnly"]) $(id).addEventListener("click", () => { st[id]=!st[id]; apply() });
new IntersectionObserver(es => { if (es[0].isIntersecting) renderMore() }, {rootMargin:"800px"}).observe($("more"));

async function load(){
  try{
    const r = await fetch("data/sales.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    ALL = data.items || []; currency = data.currency || "BHD";
    const d = new Date(data.updated);
    $("meta").textContent = "آخر تحديث " + d.toLocaleString("ar-BH", {weekday:"short",hour:"numeric",minute:"2-digit"});
    buildFilters(); apply();
  }catch(err){
    $("grid").innerHTML = `<div class="empty">ما في بيانات بعد.<br>أول تحديث يشتغل تلقائيًا خلال ساعات، أو شغّله يدويًا من GitHub Actions.</div>`;
  }
}
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
